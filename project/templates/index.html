<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NexusResearch</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

height:100vh;

background:
linear-gradient(
rgba(0,0,0,.75),
rgba(0,0,0,.75)),
url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1920&q=80");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;
}

.card{

width:700px;

padding:50px;

text-align:center;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

border-radius:25px;

box-shadow:
0 8px 32px rgba(0,0,0,.4);

color:white;
}

h1{

font-size:42px;

margin-bottom:20px;
}

p{

font-size:18px;

margin-bottom:35px;

color:#ddd;
}

.btn{

display:block;

width:250px;

margin:15px auto;

padding:15px;

border-radius:12px;

background:#00bfff;

text-decoration:none;

font-size:18px;

font-weight:bold;

color:white;

transition:.3s;
}

.btn:hover{

background:#0099ff;

transform:translateY(-2px);
}

</style>

</head>

<body>

<div class="card">

<h1>NexusResearch</h1>

<p>
AI Powered Research • Smart Analysis • Two-Factor Authentication
</p>

<a href="/login" class="btn">
LOGIN
</a>

<a href="/signup" class="btn">
SIGN UP
</a>

</div>

</body>
</html>
